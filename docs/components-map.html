<title>OTT Release Radar Components</title>
<style>
/* Layout: swimlane matrix. Rows are actors, columns are stages (Trigger → Output); dashed arrows trace one weekly run. Deliberately a single light look, like a printed handout. */
:root {
  color-scheme: light;
  --page: #ffffff;
  --navy: #14233f;
  --ink: #1b2233;
  --grid: #ffffff;
  --edge: #22324f;
  --lane-user: #e8f0fd; --lane-sys: #fdf8e3; --lane-data: #e9f7ee; --lane-ai: #fdeaf3; --lane-msg: #efeefb;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--font); padding-inline: 16px; padding-block: 28px 40px; }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 14px; }
h1 { margin: 0; text-align: center; color: var(--navy); font-size: clamp(1.3rem, 3vw, 1.9rem); font-weight: 750; letter-spacing: -0.01em; text-wrap: balance; }
.links { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; }
.links a { color: #2b4fb3; text-underline-offset: 3px; }
.diagram { overflow-x: auto; }
svg { display: block; width: 100%; min-width: 980px; height: auto; font-family: var(--font); }

.hdr { fill: var(--navy); }
.hdr-t { fill: #fff; font-size: 21px; font-weight: 600; text-anchor: middle; }
.actor-t { fill: #fff; font-size: 21px; font-weight: 700; text-anchor: middle; }
.actor-s { fill: #c9d3e6; font-size: 16px; text-anchor: middle; }
.lane-user { fill: var(--lane-user); } .lane-sys { fill: var(--lane-sys); } .lane-data { fill: var(--lane-data); }
.lane-ai { fill: var(--lane-ai); } .lane-msg { fill: var(--lane-msg); }
.col { stroke: var(--grid); stroke-width: 2; }
.e { fill: none; stroke: var(--edge); stroke-width: 1.8; stroke-dasharray: 6 5; }
.ah { fill: var(--edge); }

.box { height: 100%; display: flex; align-items: center; justify-content: center; text-align: center;
  padding: 8px 10px; border: 2px solid; border-radius: 10px; font-size: 16px; line-height: 1.32; color: var(--ink); }
.box small { display: block; font-size: 14px; margin-top: 3px; color: #3d465a; }
.trig { background: #e3e2fb; border-color: #4f46e5; }
.inp  { background: #e3edfd; border-color: #2f6fe0; }
.ctx  { background: #dcf5e4; border-color: #2e9d58; }
.proc { background: #fdedc6; border-color: #e09a1b; }
.ai   { background: #fbdcec; border-color: #d6338a; }
.msg  { background: #e3edfd; border-color: #2f6fe0; }
.out  { background: #fde4e0; border-color: #e0483a; }

@media print {
  @page { size: 1320px 885px; margin: 0; }
  body { padding-block: 20px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  svg { min-width: 0; }
}
</style>
