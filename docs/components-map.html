<title>OTT Release Radar Components</title>
<style>
/* Layout: one wide diagram card, like a whiteboard component map. Tree on the left (UI), request path on the right (backend), lib/ panel and external services below. */
:root {
  --bg: #f4f4f6;
  --card: #ffffff;
  --ink: #1d1d22;
  --muted: #55555f;
  --edge: #8a8a92;
  --core-fill: #eeedfc; --core-line: #6b5bd6; --core-ink: #3b2fa0;
  --ui-fill: #e7f4ee;   --ui-line: #4f9a80;   --ui-ink: #1f5c47;
  --ext-fill: #fbebe6;  --ext-line: #b5533c;  --ext-ink: #7a2a17;
  --lib-fill: #f2f1ed;  --lib-line: #a8a6a0;  --lib-ink: #2f2e2a;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111114; --card: #1a1a1f; --ink: #ececf1; --muted: #a3a3ad; --edge: #74747e;
    --core-fill: #24213f; --core-line: #8f82ea; --core-ink: #c9c2ff;
    --ui-fill: #16302a;   --ui-line: #5fb497;   --ui-ink: #a9e2cd;
    --ext-fill: #3a1f18;  --ext-line: #d27a62;  --ext-ink: #f5c3b4;
    --lib-fill: #26252a;  --lib-line: #6c6a72;  --lib-ink: #e2e1e6;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111114; --card: #1a1a1f; --ink: #ececf1; --muted: #a3a3ad; --edge: #74747e;
  --core-fill: #24213f; --core-line: #8f82ea; --core-ink: #c9c2ff;
  --ui-fill: #16302a;   --ui-line: #5fb497;   --ui-ink: #a9e2cd;
  --ext-fill: #3a1f18;  --ext-line: #d27a62;  --ext-ink: #f5c3b4;
  --lib-fill: #26252a;  --lib-line: #6c6a72;  --lib-ink: #e2e1e6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); padding-inline: 16px; padding-block: 32px 48px; }
.sheet { max-width: 1240px; margin: 0 auto; background: var(--card); border-radius: 18px; padding: 32px 28px 24px; display: grid; gap: 20px; }
header { display: grid; gap: 6px; }
h1 { margin: 0; font-size: clamp(1.5rem, 3.4vw, 2rem); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 0; color: var(--muted); font-size: 15px; }
.links { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; }
.links a { color: var(--core-ink); text-underline-offset: 3px; }
.diagram { overflow-x: auto; }
svg { display: block; width: 100%; min-width: 980px; height: auto; font-family: var(--font); }

.n rect { stroke-width: 1.6; }
.n .t { font-size: 16px; font-weight: 600; text-anchor: middle; }
.n .s { font-size: 13px; text-anchor: middle; }
.n .u { font-size: 12.5px; text-anchor: middle; }
.core rect { fill: var(--core-fill); stroke: var(--core-line); } .core text { fill: var(--core-ink); }
.ui rect   { fill: var(--ui-fill);   stroke: var(--ui-line); }   .ui text   { fill: var(--ui-ink); }
.ext rect  { fill: var(--ext-fill);  stroke: var(--ext-line); }  .ext text  { fill: var(--ext-ink); }
.lib rect  { fill: var(--lib-fill);  stroke: var(--lib-line); }  .lib text  { fill: var(--lib-ink); }
.lib .u, .core .u { fill: var(--muted); }
.core.inlib .u { fill: var(--core-ink); }

.e { fill: none; stroke: var(--edge); stroke-width: 1.6; }
.e.http { stroke-dasharray: 6 5; }
.ah { fill: var(--edge); }
.panel { fill: none; stroke: var(--lib-line); stroke-width: 1.5; stroke-dasharray: 7 6; }
.panel-label { font-size: 16px; font-weight: 600; fill: var(--ink); }
.note { font-size: 13px; fill: var(--muted); }
.legend text { font-size: 14px; fill: var(--ink); }
</style>

<div class="sheet">

  </header>
